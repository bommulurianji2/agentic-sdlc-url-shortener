name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app agentic scripts tests

      - name: Black (check only)
        run: black --check app agentic scripts tests

      - name: Mypy
        run: mypy app agentic scripts

      - name: Pytest with coverage
        run: pytest --cov=app --cov=agentic --cov-report=term-missing --cov-fail-under=80

      - name: Dependency vulnerability scan
        run: pip-audit --skip-editable
        continue-on-error: true # informational: flags upstream CVEs, doesn't gate the build

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image (build only, no push)
        run: docker build -t agentic-sdlc-url-shortener:ci .

      - name: Smoke-test the built image
        run: |
          docker run -d --name smoke-test -p 8000:8000 agentic-sdlc-url-shortener:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/openapi.json > /dev/null
          docker logs smoke-test
          docker stop smoke-test
